# Deploy the static SheerFlow project website to GitHub Pages.
# The interactive Node.js workbench remains local; Pages cannot host its API backend.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "assets/brand/sheerflow-banner.svg"
      - "assets/demo/workbench.svg"
      - "assets/demo/sheerflow-demo.mp4"
      - "scripts/build-pages.mjs"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the Pages site
        run: node scripts/build-pages.mjs "$RUNNER_TEMP/sheerflow-pages"

      - name: Verify deployed entry point and media
        run: |
          test -s "$RUNNER_TEMP/sheerflow-pages/index.html"
          test -s "$RUNNER_TEMP/sheerflow-pages/404.html"
          test -s "$RUNNER_TEMP/sheerflow-pages/styles.css"
          test -s "$RUNNER_TEMP/sheerflow-pages/assets/sheerflow-banner.svg"
          test -s "$RUNNER_TEMP/sheerflow-pages/assets/workbench.svg"
          test -s "$RUNNER_TEMP/sheerflow-pages/demo/sheerflow-demo.mp4"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "$RUNNER_TEMP/sheerflow-pages"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
